name: Monthly reviewed skill update proposal
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 * *'
permissions:
  contents: read
concurrency:
  group: monthly-skill-update-proposal
  cancel-in-progress: false
jobs:
  prepare-review:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test installer and proposal helper offline
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python -m unittest discover -s tests -v
      - name: Freeze upstream revisions for review (no installation)
        id: proposal
        shell: bash
        run: |
          set +e
          python scripts/propose_update.py --output-dir "$RUNNER_TEMP/skill-update-proposal" > "$RUNNER_TEMP/upstream-comparison.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/upstream-comparison.json"
          case "$result" in
            2)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              digest=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["plan_sha256"])' "$RUNNER_TEMP/upstream-comparison.json")
              echo "plan_sha256=$digest" >> "$GITHUB_OUTPUT"
              ;;
            0)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo 'Source commits are current. No update branch or PR was needed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo 'Initial setup needed: no committed sources.lock.json. No baseline was invented and no upstream request was made.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$result" ;;
          esac
      - name: Save frozen proposal and draft PR body
        if: steps.proposal.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-update-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-update-proposal/
          if-no-files-found: error
          retention-days: 60
      - name: Publish or reuse the frozen proposal as a draft PR
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLAN_SHA256: ${{ steps.proposal.outputs.plan_sha256 }}
        shell: bash
        run: |
          python scripts/publish_update.py --proposal-dir "$RUNNER_TEMP/skill-update-proposal" --expected-plan-sha256 "$EXPECTED_PLAN_SHA256" | tee "$RUNNER_TEMP/publication.json"
          cat "$RUNNER_TEMP/publication.json" >> "$GITHUB_STEP_SUMMARY"
