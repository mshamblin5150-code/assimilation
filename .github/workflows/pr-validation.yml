name: PR offline validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-offline-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test package against isolated offline fixtures
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python -m unittest discover -s tests -v
      - name: Verify complete committed source snapshots without executing them
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python scripts/snapshot_sources.py verify
