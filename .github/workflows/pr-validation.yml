name: PR offline validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-offline-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test package against isolated offline fixtures
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python -m unittest discover -s tests -v
      - name: Verify complete committed source snapshots without executing them
        env:
          GIT_ALLOW_PROTOCOL: file
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python scripts/snapshot_sources.py verify
  windows-contract:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check native Windows refusal and help contracts only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CONTRACT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CONTRACT_SOURCE_SHA256: '{"scripts/git_runtime.py":"70309b8d367849bd651f70c8d7a092b52e84015e64788265e0fea373e5ac0eec","scripts/propose_update.py":"a250efcd5d374dfea7d9b46f12b9238db78d084d96590fe241e6fcb1207acc6e","scripts/publish_update.py":"9ea05bd8b2e3d11dd9eba2f6cbb0e396737a862248215bed7c759b3947e451b4","scripts/skills.py":"16a97c1822d7ae52ef6b9fe76578ba11dfff7928210f63210cb1384870740e05","scripts/snapshot_sources.py":"1287f3cb6a54e9fd6066e8a793e73ae6c93a199ecbe182b4002d30ed75f19260","tests/windows_contract.py":"afb5d1d37f1b881cabe87d12568fe28fdf791fd1d54785f15fd286d583a9bd25"}'
        run: python -B tests/windows_contract.py --expected-sha "$env:CONTRACT_EXPECTED_SHA"
