name: Practice organizer validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: practice-organizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-practice-organizer:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regression — exercise the actual fixture guard
        shell: pwsh
        run: |
          $guard = './scripts/check_practice_organizer_fixture.ps1'
          foreach ($case in @(
            @{ source = 'examples/chad-organizer/organizer.py'; test = 'examples/chad-organizer/test_organizer.py'; expected = 'true' },
            @{ source = 'examples/chad-organizer/missing-source-for-ci.py'; test = 'examples/chad-organizer/test_organizer.py'; expected = 'false' },
            @{ source = 'examples/chad-organizer/organizer.py'; test = 'examples/chad-organizer/missing-test-for-ci.py'; expected = 'false' },
            @{ source = 'examples/chad-organizer/missing-source-for-ci.py'; test = 'examples/chad-organizer/missing-test-for-ci.py'; expected = 'false' }
          )) {
            $actual = & $guard -SourcePath $case.source -TestPath $case.test
            if ($actual -ne $case.expected) {
              throw "Fixture guard returned '$actual', expected '$($case.expected)'"
            }
          }
          Write-Host 'PASS: real guard returns correct results for all four combinations'
      - name: Check whether practice organizer exists on this PR head
        id: fixture
        shell: pwsh
        run: |
          $present = & ./scripts/check_practice_organizer_fixture.ps1 -SourcePath 'examples/chad-organizer/organizer.py' -TestPath 'examples/chad-organizer/test_organizer.py'
          if ($present -notin @('true', 'false')) { throw 'Invalid fixture guard output' }
          "present=$present" >> $env:GITHUB_OUTPUT
          if ($present -eq 'false') { Write-Host 'Organizer absent from this PR head; no organizer tests can run.' }
      - name: Test only disposable practice-folder fixtures
        if: steps.fixture.outputs.present == 'true'
        run: python -B -m unittest discover -s examples/chad-organizer -v
