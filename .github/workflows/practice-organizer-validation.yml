name: Practice organizer validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: practice-organizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-practice-organizer:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify fixture detection fails closed for missing paths
        shell: pwsh
        run: |
          $missingSource = 'examples/chad-organizer/absent-fixture-source-for-ci.py'
          $missingTest = 'examples/chad-organizer/absent-fixture-test-for-ci.py'
          if ((Test-Path $missingSource -PathType Leaf) -or (Test-Path $missingTest -PathType Leaf)) {
            throw 'Synthetic missing-fixture names unexpectedly exist; choose fresh names'
          }
          $bothMissing = (Test-Path $missingSource -PathType Leaf) -and (Test-Path $missingTest -PathType Leaf)
          $sourceMissing = (Test-Path $missingSource -PathType Leaf) -and (Test-Path 'examples/chad-organizer/test_organizer.py' -PathType Leaf)
          $testMissing = (Test-Path 'examples/chad-organizer/organizer.py' -PathType Leaf) -and (Test-Path $missingTest -PathType Leaf)
          if ($bothMissing -or $sourceMissing -or $testMissing) {
            throw 'Missing organizer fixture must not qualify for test discovery'
          }
          Write-Host 'PASS: missing source, missing tests, and both missing refuse discovery'
      - name: Check whether practice organizer exists on this PR head
        id: fixture
        shell: pwsh
        run: |
          $present = (Test-Path 'examples/chad-organizer/organizer.py' -PathType Leaf) -and (Test-Path 'examples/chad-organizer/test_organizer.py' -PathType Leaf)
          if ($present) { 'present=true' >> $env:GITHUB_OUTPUT } else { 'present=false' >> $env:GITHUB_OUTPUT; Write-Host 'Organizer absent from this PR head; no organizer tests can run.' }
      - name: Test only disposable practice-folder fixtures
        if: steps.fixture.outputs.present == 'true'
        run: python -B -m unittest discover -s examples/chad-organizer -v
