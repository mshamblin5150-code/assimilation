name: Practice organizer validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: practice-organizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-practice-organizer:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test only disposable practice-folder fixtures
        run: python -B -m unittest discover -s examples/chad-organizer -v
